name: ReadLingo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/dictionary.js
      - run: node --test tests/test_dictionary.cjs
      - run: node --check web/storage.js
      - run: node --test tests/test_storage.cjs
      - run: node --check web/epub.js
      - run: node --test tests/test_frontend.cjs
      - run: node --test tests/test_epub.cjs
      - run: node scripts/build_web.cjs
